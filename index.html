async function elegirFinca(){
  const el = $("cfg-fincas");
  el.innerHTML = '<div style="font-size:13px;color:#5b6467;margin-top:8px">Cargando fincas…</div>';

async function prepararFinca(codigo){
  if(!navigator.onLine){ await alerta("Sin conexión", "Para preparar la finca hace falta conexión (mejor wifi)."); return; }
  if(PRECARGA.activa) return;
  const ant = fincaCodigo();
  if(ant && ant !== codigo){
    const abiertos = formsFinca().filter(f => f.estado === "abierto").length, pend = nPendientes();
    if((abiertos || pend) && !await pregunta("Cambiar de finca", "En la finca actual hay " + abiertos + " conteo(s) abierto(s) y " + pend + " por subir. No se borran: vuelven a verse al volver a esa finca.", "Cambiar", "Cancelar")) return;
    localStorage.removeItem(K.formActivo); S.cap = null;
  }
  abrirHoja('<h3>Preparando la finca</h3><div id="pf-1" style="font-size:14px">1. Parcelas, planos y normas…</div>' +
    '<div id="pf-2" style="font-size:14px;margin-top:8px;color:#8b9295">2. Imágenes de satélite</div><div class="barra"><i id="pf-bar"></i></div>' +
    '<div id="pf-det" style="font-size:12px;color:#5b6467;margin-top:6px"></div><div class="fila-btn" id="pf-acc"><button class="btn s" onclick="PRECARGA.cancelar=true">Detener</button></div>');
  PRECARGA = {activa: true, cancelar: false};
  try{
    let d;
    try{ d = await descargarFinca(codigo); }
    catch(e){ $("pf-1").innerHTML = '1. <b style="color:' + ALTO + '">' + esc(e.message) + '</b>'; $("pf-acc").innerHTML = '<button class="btn" onclick="cerrarHoja()">Cerrar</button>'; return; }
    S.mapa = null;
    $("pf-1").innerHTML = '1. <b style="color:' + VERDE + '">' + esc(d.finca.nombre) + ': ' + d.parcelas.length + ' parcelas ✓</b>';
    $("pf-2").style.color = "";
    const tiles = tilesDeFinca(), total = tiles.length;
    let hechos = 0, ya = 0, errores = 0, bytes = 0, cursor = 0;
    const t0 = Date.now();
    const pintar = () => {
      const p = hechos + ya + errores;
      $("pf-bar").style.width = Math.round(p / total * 100) + "%";
      $("pf-det").textContent = p + " de " + total + " · " + (bytes / 1048576).toFixed(1) + " MB" + (ya ? " · " + ya + " ya estaban" : "") + (errores ? " · " + errores + " fallos" : "") + (p < total && p ? " · quedan ~" + Math.round((Date.now() - t0) / 1000 / p * (total - p)) + " s" : "");
    };
    const trab = async () => {
      while(!PRECARGA.cancelar && cursor < total){
        const t = tiles[cursor++];
        try{
          if(await tGet(t.k)) ya++;
          else { const r = await fetch(tileURL(t.z, t.x, t.y)); if(!r.ok) errores++; else { const b = await r.blob(); bytes += b.size; await tPut(t.k, b); hechos++; } }
        } catch(e){ errores++; }
        if((hechos + ya + errores) % 5 === 0 || cursor >= total) pintar();
      }
    };
    await Promise.all(Array.from({length: 6}, trab));
    pintar();
    $("pf-2").innerHTML = '2. ' + (PRECARGA.cancelar ? '<b style="color:' + BAJO + '">detenido (se guarda lo descargado)</b>' : errores ? '<b style="color:' + BAJO + '">' + (total - errores) + ' de ' + total + '</b> · repite para completar' : '<b style="color:' + VERDE + '">' + total + ' imágenes ✓</b>');
    $("pf-acc").innerHTML = '<button class="btn" onclick="cerrarHoja();pintarConfig()">Listo</button>';
    pintarBadge();
  } finally { PRECARGA.activa = false; }
}

}

function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); _promptInstalar = e; pintarAvisoInstalar(); });

function pintarAvisoInstalar(){

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => { const n = reg.installing; if(n) n.addEventListener("statechange", () => { if(n.state === "installed" && navigator.serviceWorker.controller) bannerVersion(reg); }); });
      if(reg.waiting && navigator.serviceWorker.controller) bannerVersion(reg);
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
      document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {}); });
    }).catch(e => console.warn("SW:", e));
    let rec = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if(rec) return; rec = true; location.reload(); });
  });

function bannerVersion(reg){
  if($("banner-version")) return;
  const d = document.createElement("div");

}
